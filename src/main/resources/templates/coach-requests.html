<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý yêu cầu liên kết</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px;
            color: #047857;
        }

        .subtitle {
            margin: 0;
            color: #64748b;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0f172a0d;
        }

        .request {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .request:last-child {
            border-bottom: none;
        }

        .request h3 {
            margin: 0 0 8px;
        }

        .request p {
            margin: 5px 0;
            color: #64748b;
        }

        .actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button {
            border: none;
            border-radius: 7px;
            padding: 10px 15px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .accept {
            background: #059669;
        }

        .accept:hover {
            background: #047857;
        }

        .reject {
            background: #dc2626;
        }

        .reject:hover {
            background: #b91c1c;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .accepted {
            background: #dcfce7;
            color: #166534;
        }

        .rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            padding: 24px 0;
            color: #64748b;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #047857;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .container {
                margin: 16px auto;
                padding: 16px;
            }

            .request {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>Yêu cầu liên kết VĐV</h1>
                <p class="subtitle">
                    Xem thông tin và quyết định chấp nhận hoặc từ chối yêu cầu.
                </p>
            </div>
        </div>

        <div th:if="${success}" class="message success" th:text="${success}"></div>
        <div th:if="${error}" class="message error" th:text="${error}"></div>

        <div class="card">
            <div th:if="${#lists.isEmpty(requests)}" class="empty">
                Chưa có yêu cầu liên kết nào.
            </div>

            <div th:each="request : ${requests}" class="request">
                <div>
                    <h3 th:text="${request.athlete.fullName}">Tên vận động viên</h3>
                    <!-- <p>
                        Tên đăng nhập:
                        <strong th:text="${request.athlete.username}">username</strong>
                    </p> -->
                    <p>
                        Email:
                        <span th:text="${request.athlete.email}">athlete@example.com</span>
                    </p>
                    <p>
                        Ngày gửi:
                        <span th:text="${#temporals.format(request.requestedAt, 'dd/MM/yyyy HH:mm')}">
                            01/01/2026 10:00
                        </span>
                    </p>
                </div>

                <div class="actions" th:if="${request.status == 'PENDING'}">
                    <form th:action="@{/coach/requests/{id}/accept(id=${request.id})}" method="post">
                        <button class="button accept" type="submit">Chấp nhận</button>
                    </form>

                    <form th:action="@{/coach/requests/{id}/reject(id=${request.id})}" method="post">
                        <button class="button reject" type="submit">Từ chối</button>
                    </form>
                </div>

                <span th:unless="${request.status == 'PENDING'}" class="status"
                    th:classappend="${request.status == 'ACCEPTED'} ? ' accepted' : ' rejected'"
                    th:text="${request.status == 'ACCEPTED'} ? 'Đã chấp nhận' : 'Đã từ chối'">
                    Đã xử lý
                </span>
            </div>
        </div>

        <a class="back" th:href="@{/coach/dashboard}">
            ← Quay lại trang HLV
        </a>
    </div>
</body>

</html>
