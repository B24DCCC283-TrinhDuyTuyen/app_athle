<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Athletics Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .register-box {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #123b70;
            text-align: center;
        }

        .description {
            margin-bottom: 24px;
            color: #64748b;
            text-align: center;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #93c5fd;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
        }

        .login-link a {
            color: #1d4ed8;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="register-box">
        <h1>Athletics Management</h1>

        <p class="description">Tạo tài khoản của bạn</p>

        <div th:if="${success}" th:text="${success}" style="padding: 12px; margin-bottom: 16px; color: #166534;
            background: #dcfce7; border-radius: 6px;">
        </div>

        <div th:if="${error}" th:text="${error}" style="padding: 12px; margin-bottom: 16px; color: #991b1b;
            background: #fee2e2; border-radius: 6px;">
        </div>


        <form th:action="@{/register}" method="post">
            <label for="fullName">Họ và tên</label>
            <input type="text" id="fullName" name="fullName" placeholder="Nhập họ và tên" required>

            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Nhập email" required>

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" minlength="8" required>

            <label for="role">Vai trò</label>
            <select id="role" name="role" required>
                <option value="">-- Chọn vai trò --</option>
                <option value="ATHLETE">Vận động viên</option>
                <option value="COACH">Huấn luyện viên</option>
            </select>

            <button type="submit">Đăng ký</button>
        </form>

        <p class="login-link">
            Đã có tài khoản?
            <a th:href="@{/login}">Đăng nhập</a>
        </p>
    </div>
</body>

</html>
